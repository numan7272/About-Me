      <path id="star" fill="#ffdd00" d="M0-3 .9-1.5 2.6-1.5 1.7 0 2.6 1.5 .9 1.5 0 3-.9 1.5-2.6 1.5-1.7 0-2.6-1.5-.9-1.5Z"/>
