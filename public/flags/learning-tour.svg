    <title>Finland</title>
    <path fill="#fff" d="M0 0h18v11H0z"/>
    <path fill="#002f6c" d="M5 0h3v11H5zM0 4h18v3H0z"/>
  </svg>
  <svg x="231" y="9" width="198" height="126" viewBox="0 0 33 21">
    <title>Estonia</title>
    <path fill="#4891d9" d="M0 0h33v7H0z"/>
    <path fill="#101010" d="M0 7h33v7H0z"/>
    <path fill="#fff" d="M0 14h33v7H0z"/>
  </svg>
  <svg x="446" y="20" width="208" height="104" viewBox="0 0 10 5">
