<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Tiefes Ostsee-Petrol — gleiche Fläche wie das UI (--ink → --surface) -->
  <defs>
    <radialGradient id="bg" cx="0.25" cy="0.2" r="1.1">
      <stop offset="0" stop-color="#22332f"/>
      <stop offset="1" stop-color="#142120"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>

  <!-- "N"-Monogramm mit runden Kappen — liest sich bei 16px -->
  <path d="M 20 46 L 20 19 L 44 46 L 44 18"
        fill="none" stroke="#ffd28a" stroke-width="7"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Seafoam-Punkt -->
  <circle cx="51" cy="50" r="4" fill="#8fe3c0"/>
</svg>
